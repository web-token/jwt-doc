          - the-symfony-bundle/key-and-key-set-management/key-management-jwk.md
          - the-symfony-bundle/key-and-key-set-management/key-set-management-jwkset.md
      - the-symfony-bundle/header-and-claim-checker-management.md
      - "Signed tokens":
