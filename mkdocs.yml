      - introduction/the-framework.md
      - introduction/pre-requisite.md
      - introduction/contributing.md
  - "The components":
      - the-components/algorithm-management-jwa.md
      - "Key (JWK) and key set (JWKSet)":
          - the-components/key-jwk-and-key-set-jwkset/README.md
          - the-components/key-jwk-and-key-set-jwkset/key-management.md
          - the-components/key-jwk-and-key-set-jwkset/key-set-management.md
      - the-components/header-checker.md
      - the-components/claim-checker.md
